name: Release & Deploy Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0; defaults to current ref name)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.0-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build Web & Pages Artifact
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Penpa+ assets & generate icons
        run: |
          node scripts/gen-icons.mjs
          pnpm run sync:penpa

      - name: Build Web dist
        run: |
          pnpm run build
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Archive Web bundle for Release
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p release-assets
          (cd dist && zip -qr "../release-assets/PenpaAnywhere-${TAG}-web.zip" .)

      - name: Upload Web release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release-assets/*
          if-no-files-found: error

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    name: Build Windows (Release)
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Penpa+ assets & generate icons
        run: |
          node scripts/gen-icons.mjs
          pnpm run sync:penpa

      - name: Build Windows Tauri 2 release
        run: pnpm exec tauri build

      - name: Collect Windows release assets
        shell: pwsh
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "src-tauri/target/release/penpaanywhere.exe" "release-assets/PenpaAnywhere-$env:TAG-windows-x64-portable.exe"
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release-assets/PenpaAnywhere-$env:TAG-windows-x64-setup.exe"
          }
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release-assets/PenpaAnywhere-$env:TAG-windows-x64.msi"
          }
          Get-ChildItem release-assets

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    needs: meta
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-dual

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Penpa+ assets & generate icons
        run: |
          node scripts/gen-icons.mjs
          pnpm run sync:penpa

      - name: Build & package macOS Apple Silicon (aarch64)
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p release-assets
          pnpm exec tauri build --target aarch64-apple-darwin --bundles app
          APP_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          codesign --force --deep --sign - "${APP_DIR}/PenpaAnywhere.app"
          tar -czf "release-assets/PenpaAnywhere-${TAG}-macos-apple-silicon.app.tar.gz" -C "${APP_DIR}" PenpaAnywhere.app
          hdiutil create -volname "PenpaAnywhere" -srcfolder "${APP_DIR}/PenpaAnywhere.app" -ov -format UDZO "release-assets/PenpaAnywhere-${TAG}-macos-apple-silicon.dmg"

      - name: Build & package macOS Intel (x86_64)
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          pnpm exec tauri build --target x86_64-apple-darwin --bundles app
          APP_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/macos"
          codesign --force --deep --sign - "${APP_DIR}/PenpaAnywhere.app"
          tar -czf "release-assets/PenpaAnywhere-${TAG}-macos-intel.app.tar.gz" -C "${APP_DIR}" PenpaAnywhere.app
          hdiutil create -volname "PenpaAnywhere" -srcfolder "${APP_DIR}/PenpaAnywhere.app" -ov -format UDZO "release-assets/PenpaAnywhere-${TAG}-macos-intel.dmg"
          ls -lh release-assets

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  build-android:
    name: Build Android (Release APK)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend & sync Android assets
        run: |
          node scripts/gen-icons.mjs
          pnpm run sync:penpa
          pnpm run android:prepare

      - name: Decode optional Android release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/release.keystore
            echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Android release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect Android APK
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/PenpaAnywhere-${TAG}-android.apk"
          ls -lh release-assets

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Create Draft GitHub Release
    needs:
      - meta
      - build-web
      - build-windows
      - build-macos
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate release notes from commits
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*", "--sort=-v:refname"], text=True
          ).splitlines()
          prev_tag = next((t for t in tags if t != tag), "")

          rev_range = f"{prev_tag}..HEAD" if prev_tag else "HEAD"
          raw = subprocess.check_output(
              ["git", "log", rev_range, "--no-merges", "--pretty=format:%h\t%s"], text=True
          ).splitlines()

          feats, fixes, others = [], [], []
          for line in raw:
              if "\t" not in line:
                  continue
              sha, subj = line.split("\t", 1)
              m = re.match(r"^([a-zA-Z]+)(?:\(([^)]+)\))?(!)?:\s*(.+)$", subj)
              if m:
                  kind, scope, breaking, desc = m.groups()
                  kind = kind.lower()
                  prefix = f"**{scope}**: " if scope else ""
                  bang = " **[BREAKING]**" if breaking else ""
                  entry = f"- {prefix}{desc}{bang} (`{sha}`)"
                  if kind == "feat":
                      feats.append(entry)
                  elif kind == "fix":
                      fixes.append(entry)
                  else:
                      others.append(entry)
              else:
                  others.append(f"- {subj} (`{sha}`)")

          sections = []
          if feats:
              sections.append("### Features\n\n" + "\n".join(feats))
          if fixes:
              sections.append("### Fixes\n\n" + "\n".join(fixes))
          if others:
              sections.append("### Other Changes\n\n" + "\n".join(others))

          changelog_url = (
              f"https://github.com/{repo}/compare/{prev_tag}...{tag}"
              if prev_tag
              else f"https://github.com/{repo}/commits/{tag}"
          )
          sections.append(f"**Full Changelog**: {changelog_url}")

          notes = "\n\n".join(sections) + "\n"
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          print(notes)
          PY

      - name: Create or update Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          ls -lh release-assets
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md -R "${{ github.repository }}"
            gh release upload "$TAG" release-assets/* --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" release-assets/* \
              --draft \
              --title "PenpaAnywhere ${TAG}" \
              --notes-file release-notes.md \
              -R "${{ github.repository }}"
          fi
