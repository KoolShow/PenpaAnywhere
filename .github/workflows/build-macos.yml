name: Build macOS (Tauri 2)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: apple-silicon
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Sync Penpa+ submodule assets & generate icons
        run: |
          node scripts/gen-icons.mjs
          pnpm run sync:penpa

      - name: Build macOS Tauri 2 bundle (.app & .dmg)
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - name: Upload macOS bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PenpaAnywhere-macOS-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
